<svg viewBox="0 0 1100 360" width="1100" height="360" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans', 'Helvetica Neue', sans-serif">
  <rect width="1100" height="360" fill="white"/>

  <text x="400" y="30" font-size="14" fill="#666" text-anchor="middle" font-weight="600">You upload a photo of a skin lesion to an AI tool. The AI gives a confident diagnosis.</text>
  <text x="400" y="52" font-size="14" fill="#666" text-anchor="middle" font-weight="600">But how good is that answer -- and does it depend on who you are?</text>

  <!-- Three image types -->
  <g transform="translate(60, 75)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#fdf5f0" stroke="#e8d0c0" stroke-width="1"/>
    <circle cx="100" cy="52" r="28" fill="#e0b8a0" opacity="0.5"/>
    <circle cx="100" cy="52" r="14" fill="#c09070" opacity="0.5"/>
    <text x="100" y="108" font-size="13" fill="#888" text-anchor="middle">Dermatology</text>

    <rect x="225" y="0" width="200" height="120" rx="10" fill="#f0f4f8" stroke="#c8d8e8" stroke-width="1"/>
    <ellipse cx="305" cy="48" rx="18" ry="30" fill="none" stroke="#7a9ab5" stroke-width="2.5"/>
    <ellipse cx="345" cy="48" rx="18" ry="30" fill="none" stroke="#7a9ab5" stroke-width="2.5"/>
    <text x="325" y="108" font-size="13" fill="#888" text-anchor="middle">Radiology</text>

    <rect x="450" y="0" width="200" height="120" rx="10" fill="#f5f0f8" stroke="#d0c0e0" stroke-width="1"/>
    <circle cx="510" cy="42" r="14" fill="#b8a0d0" opacity="0.5"/>
    <circle cx="545" cy="56" r="16" fill="#a090c0" opacity="0.4"/>
    <circle cx="525" cy="64" r="10" fill="#c0a8d8" opacity="0.5"/>
    <text x="550" y="108" font-size="13" fill="#888" text-anchor="middle">Pathology</text>
  </g>

  <!-- Performance bars -->
  <g transform="translate(60, 220)">
    <text x="330" y="15" font-size="14" fill="#888" text-anchor="middle" font-weight="600">Same AI model, same question -- different accuracy by patient</text>

    <circle cx="20" cy="48" r="13" fill="none" stroke="#1a6b5a" stroke-width="2.5"/>
    <text x="45" y="52" font-size="13" fill="#666">Patient A</text>
    <rect x="170" y="39" width="380" height="20" rx="5" fill="#1a6b5a" opacity="0.45"/>
    <text x="560" y="53" font-size="12" fill="#1a6b5a" font-weight="600">high accuracy</text>

    <circle cx="20" cy="85" r="13" fill="none" stroke="#e8a040" stroke-width="2.5"/>
    <text x="45" y="89" font-size="13" fill="#666">Patient B</text>
    <rect x="170" y="76" width="240" height="20" rx="5" fill="#e8a040" opacity="0.45"/>
    <text x="420" y="90" font-size="12" fill="#e8a040" font-weight="600">moderate</text>

    <circle cx="20" cy="122" r="13" fill="none" stroke="#d94030" stroke-width="2.5"/>
    <text x="45" y="126" font-size="13" fill="#666">Patient C</text>
    <rect x="170" y="113" width="120" height="20" rx="5" fill="#d94030" opacity="0.45"/>
    <text x="300" y="127" font-size="12" fill="#d94030" font-weight="600">low accuracy</text>
  </g>

  <!-- Insight on right -->
  <g transform="translate(780, 80)">
    <text x="0" y="20" font-size="16" fill="#d94030" font-weight="700">The model fails</text>
    <text x="0" y="42" font-size="16" fill="#d94030" font-weight="700">differently depending</text>
    <text x="0" y="64" font-size="16" fill="#d94030" font-weight="700">on who you are.</text>

    <line x1="0" y1="85" x2="260" y2="85" stroke="#e8e8e8" stroke-width="1"/>

    <text x="0" y="112" font-size="13" fill="#999">Darker skin tones,</text>
    <text x="0" y="130" font-size="13" fill="#999">older patients, specific</text>
    <text x="0" y="148" font-size="13" fill="#999">imaging protocols --</text>
    <text x="0" y="166" font-size="13" fill="#999">consistent accuracy drops.</text>

    <line x1="0" y1="188" x2="260" y2="188" stroke="#e8e8e8" stroke-width="1"/>

    <text x="0" y="215" font-size="13" fill="#d94030" font-weight="600">Safety guardrails are</text>
    <text x="0" y="235" font-size="13" fill="#d94030" font-weight="600">trivially bypassed</text>
    <text x="0" y="255" font-size="12" fill="#c08060">via simple prompt rephrasing</text>
  </g>
</svg>
