<svg viewBox="0 0 1100 300" width="1100" height="300" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans', 'Helvetica Neue', sans-serif">
  <rect width="1100" height="300" fill="white"/>

  <!-- Pipeline: Input → Transformer → Output -->
  <g transform="translate(50, 30)">
    <!-- Input -->
    <rect x="0" y="20" width="180" height="120" rx="12" fill="#f0f7fa" stroke="#b8d4e3" stroke-width="1.2"/>
    <text x="90" y="60" font-size="15" fill="#4a8aad" text-anchor="middle" font-weight="700">Patient history</text>
    <text x="90" y="82" font-size="12" fill="#8aacbe" text-anchor="middle">Longitudinal lab sequence</text>
    <!-- Mini bars -->
    <rect x="25" y="95" width="16" height="30" rx="3" fill="#4a9aad" opacity="0.2"/>
    <rect x="48" y="88" width="16" height="37" rx="3" fill="#4a9aad" opacity="0.3"/>
    <rect x="71" y="91" width="16" height="34" rx="3" fill="#4a9aad" opacity="0.4"/>
    <rect x="94" y="84" width="16" height="41" rx="3" fill="#4a9aad" opacity="0.5"/>
    <rect x="117" y="78" width="16" height="47" rx="3" fill="#4a9aad" opacity="0.65"/>
    <rect x="140" y="72" width="16" height="53" rx="3" fill="#4a9aad" opacity="0.8"/>

    <!-- Arrow -->
    <line x1="195" y1="80" x2="240" y2="80" stroke="#1a6b5a" stroke-width="3"/>
    <polygon points="237,72 252,80 237,88" fill="#1a6b5a"/>

    <!-- Transformer -->
    <rect x="260" y="10" width="200" height="140" rx="12" fill="#e6f5f0" stroke="#1a6b5a" stroke-width="2.5"/>
    <text x="360" y="55" font-size="18" fill="#1a6b5a" text-anchor="middle" font-weight="800">NORMA</text>
    <text x="360" y="78" font-size="13" fill="#2a9d7e" text-anchor="middle">Autoregressive</text>
    <text x="360" y="96" font-size="13" fill="#2a9d7e" text-anchor="middle">Transformer</text>
    <text x="360" y="130" font-size="11" fill="#4a8a7a" text-anchor="middle">3.4M sequences &middot; ~2B lab values</text>

    <!-- Arrow -->
    <line x1="475" y1="80" x2="520" y2="80" stroke="#1a6b5a" stroke-width="3"/>
    <polygon points="517,72 532,80 517,88" fill="#1a6b5a"/>

    <!-- Output -->
    <rect x="540" y="20" width="180" height="120" rx="12" fill="#f0f7fa" stroke="#b8d4e3" stroke-width="1.2"/>
    <text x="630" y="60" font-size="15" fill="#4a8aad" text-anchor="middle" font-weight="700">Adaptive</text>
    <text x="630" y="82" font-size="15" fill="#4a8aad" text-anchor="middle" font-weight="700">reference interval</text>
    <text x="630" y="110" font-size="12" fill="#8aacbe" text-anchor="middle">Per-patient, per-analyte</text>
  </g>

  <!-- Key insight -->
  <rect x="50" y="185" width="670" height="45" rx="8" fill="#e6f5f0"/>
  <text x="385" y="212" font-size="14" fill="#1a6b5a" text-anchor="middle" font-weight="700">Anchors individual trajectories to population priors -- sensitivity of personal baselines + specificity of population context</text>

  <!-- Impact stats on the right -->
  <g transform="translate(790, 20)">
    <text x="130" y="35" font-size="48" fill="#1a6b5a" text-anchor="middle" font-weight="800">9.3 mo</text>
    <text x="130" y="62" font-size="14" fill="#2a9d7e" text-anchor="middle" font-weight="600">earlier detection</text>

    <line x1="30" y1="82" x2="230" y2="82" stroke="#e8e8e8" stroke-width="1"/>

    <text x="130" y="108" font-size="13" fill="#888" text-anchor="middle">Higher precision for</text>
    <text x="130" y="128" font-size="13" fill="#888" text-anchor="middle">mortality, AKI, chronic disease</text>

    <line x1="30" y1="148" x2="230" y2="148" stroke="#e8e8e8" stroke-width="1"/>

    <text x="130" y="175" font-size="13" fill="#1a6b5a" text-anchor="middle" font-weight="600">Open source</text>
    <text x="130" y="195" font-size="12" fill="#4a9a8a" text-anchor="middle">Model, code, interactive demo</text>

    <!-- Scale -->
    <rect x="0" y="220" width="260" height="30" rx="6" fill="#f0f7fa"/>
    <text x="130" y="240" font-size="12" fill="#4a8aad" text-anchor="middle">1.5M patients &middot; 20+ years &middot; 30 analytes</text>
  </g>
</svg>
