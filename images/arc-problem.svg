<svg viewBox="0 0 1100 340" width="1100" height="340" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans', 'Helvetica Neue', sans-serif">
  <rect width="1100" height="340" fill="white"/>

  <text x="400" y="30" font-size="14" fill="#666" text-anchor="middle" font-weight="600">Your breathing test uses a different equation depending on your race</text>

  <!-- The equation -->
  <rect x="100" y="50" width="600" height="55" rx="10" fill="#fef5f0" stroke="#e8c0b0" stroke-width="1.2"/>
  <text x="400" y="78" font-size="16" fill="#555" text-anchor="middle">Expected lung function = f( age, sex, height, <tspan fill="#d94030" font-weight="800">race</tspan> )</text>
  <text x="400" y="96" font-size="12" fill="#c08060" text-anchor="middle">Race is a social category with no single biological meaning</text>

  <!-- Two groups -->
  <g transform="translate(80, 125)">
    <rect x="0" y="0" width="270" height="140" rx="12" fill="#f8f9fa" stroke="#e5e5e5" stroke-width="1"/>
    <text x="135" y="30" font-size="14" fill="#888" text-anchor="middle" font-weight="600">Equation A</text>
    <!-- Abstract person icons -->
    <circle cx="55" cy="72" r="16" fill="none" stroke="#8aacbe" stroke-width="2.5"/>
    <line x1="55" y1="88" x2="55" y2="112" stroke="#8aacbe" stroke-width="2.5"/>
    <circle cx="115" cy="72" r="16" fill="none" stroke="#8aacbe" stroke-width="2.5"/>
    <line x1="115" y1="88" x2="115" y2="112" stroke="#8aacbe" stroke-width="2.5"/>
    <circle cx="175" cy="72" r="16" fill="none" stroke="#8aacbe" stroke-width="2.5"/>
    <line x1="175" y1="88" x2="175" y2="112" stroke="#8aacbe" stroke-width="2.5"/>
    <circle cx="235" cy="72" r="16" fill="none" stroke="#8aacbe" stroke-width="2.5"/>
    <line x1="235" y1="88" x2="235" y2="112" stroke="#8aacbe" stroke-width="2.5"/>
    <text x="135" y="132" font-size="13" fill="#6a8a9a" text-anchor="middle">Expected: higher lung function</text>
  </g>

  <!-- Red divider -->
  <line x1="400" y1="135" x2="400" y2="255" stroke="#d94030" stroke-width="3" stroke-dasharray="8,5"/>

  <g transform="translate(430, 125)">
    <rect x="0" y="0" width="270" height="140" rx="12" fill="#f8f9fa" stroke="#e5e5e5" stroke-width="1"/>
    <text x="135" y="30" font-size="14" fill="#888" text-anchor="middle" font-weight="600">Equation B</text>
    <circle cx="55" cy="72" r="16" fill="none" stroke="#8aacbe" stroke-width="2.5"/>
    <line x1="55" y1="88" x2="55" y2="112" stroke="#8aacbe" stroke-width="2.5"/>
    <circle cx="115" cy="72" r="16" fill="none" stroke="#8aacbe" stroke-width="2.5"/>
    <line x1="115" y1="88" x2="115" y2="112" stroke="#8aacbe" stroke-width="2.5"/>
    <circle cx="175" cy="72" r="16" fill="none" stroke="#8aacbe" stroke-width="2.5"/>
    <line x1="175" y1="88" x2="175" y2="112" stroke="#8aacbe" stroke-width="2.5"/>
    <circle cx="235" cy="72" r="16" fill="none" stroke="#8aacbe" stroke-width="2.5"/>
    <line x1="235" y1="88" x2="235" y2="112" stroke="#8aacbe" stroke-width="2.5"/>
    <text x="135" y="132" font-size="13" fill="#6a8a9a" text-anchor="middle">Expected: lower lung function</text>
  </g>

  <!-- Insight on the right -->
  <g transform="translate(780, 130)">
    <text x="0" y="20" font-size="16" fill="#d94030" font-weight="700">Simply removing</text>
    <text x="0" y="42" font-size="16" fill="#d94030" font-weight="700">race doesn't address</text>
    <text x="0" y="64" font-size="16" fill="#d94030" font-weight="700">what it was proxying.</text>
    <line x1="0" y1="85" x2="240" y2="85" stroke="#e8e8e8" stroke-width="1"/>
    <text x="0" y="110" font-size="13" fill="#999">This practice dates</text>
    <text x="0" y="128" font-size="13" fill="#999">to the 1840s.</text>
  </g>
</svg>
