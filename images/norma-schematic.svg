<svg viewBox="0 0 1600 480" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans', 'Helvetica Neue', sans-serif">
  <rect width="1600" height="480" fill="white"/>
  <rect x="0" y="0" width="1600" height="3" fill="#1a6b5a"/>

  <!-- ===== LEFT: PROBLEM ===== -->
  <text x="80" y="45" font-size="14" fill="#999" font-weight="700" letter-spacing="0.15em">THE PROBLEM</text>

  <g transform="translate(60, 70)">
    <!-- Large, clean trajectory chart -->
    <text x="220" y="20" font-size="14" fill="#666" text-anchor="middle" font-weight="600">Your lab values over years of doctor visits</text>

    <!-- Population band -->
    <rect x="30" y="40" width="400" height="250" rx="6" fill="#f0f5f8" opacity="0.5"/>
    <text x="48" y="62" font-size="12" fill="#8aacbe">Population "normal" range</text>
    <line x1="30" y1="40" x2="430" y2="40" stroke="#b8d0dd" stroke-width="1.2" stroke-dasharray="6,4"/>
    <line x1="30" y1="290" x2="430" y2="290" stroke="#b8d0dd" stroke-width="1.2" stroke-dasharray="6,4"/>

    <!-- Patient trajectory -->
    <path d="M50,260 C110,254 170,240 230,215 C290,186 350,148 410,100" fill="none" stroke="#d94030" stroke-width="4" stroke-linecap="round"/>
    <path d="M50,260 C110,254 170,240 230,215 C290,186 350,148 410,100" fill="none" stroke="#d94030" stroke-width="10" stroke-linecap="round" opacity="0.08"/>

    <!-- Visits with "normal" badges -->
    <circle cx="50" cy="260" r="7" fill="#d94030"/>
    <rect x="62" y="250" width="60" height="20" rx="4" fill="#e8f5e9"/>
    <text x="92" y="264" font-size="11" fill="#388e3c" text-anchor="middle" font-weight="600">Normal</text>

    <circle cx="150" cy="244" r="7" fill="#d94030"/>
    <rect x="162" y="234" width="60" height="20" rx="4" fill="#e8f5e9"/>
    <text x="192" y="248" font-size="11" fill="#388e3c" text-anchor="middle" font-weight="600">Normal</text>

    <circle cx="250" cy="215" r="7" fill="#d94030"/>
    <rect x="262" y="205" width="60" height="20" rx="4" fill="#e8f5e9"/>
    <text x="292" y="219" font-size="11" fill="#388e3c" text-anchor="middle" font-weight="600">Normal</text>

    <circle cx="350" cy="168" r="7" fill="#d94030"/>
    <rect x="362" y="158" width="60" height="20" rx="4" fill="#e8f5e9"/>
    <text x="392" y="172" font-size="11" fill="#388e3c" text-anchor="middle" font-weight="600">Normal</text>

    <circle cx="410" cy="100" r="7" fill="#d94030"/>

    <!-- Disease annotation -->
    <text x="410" y="85" font-size="13" fill="#d94030" font-weight="700" text-anchor="middle">Disease developing</text>

    <!-- Time axis -->
    <text x="230" y="320" font-size="12" fill="#bbb" text-anchor="middle">Time (years)</text>
  </g>

  <!-- Problem punchline -->
  <text x="280" y="430" font-size="15" fill="#d94030" text-anchor="middle" font-weight="700">Every result is "normal." The drift is invisible.</text>
  <text x="280" y="455" font-size="13" fill="#999" text-anchor="middle">Personalizing alone overcorrects -- flagging healthy values as abnormal.</text>

  <!-- ===== Divider ===== -->
  <line x1="530" y1="30" x2="530" y2="460" stroke="#e8e8e8" stroke-width="1"/>

  <!-- ===== CENTER: APPROACH ===== -->
  <text x="590" y="45" font-size="14" fill="#1a6b5a" font-weight="700" letter-spacing="0.15em">OUR APPROACH</text>

  <g transform="translate(560, 70)">
    <!-- Title -->
    <text x="250" y="25" font-size="22" fill="#1a6b5a" text-anchor="middle" font-weight="800">NORMA</text>
    <text x="250" y="50" font-size="13" fill="#4a9a8a" text-anchor="middle">Transformer trained on longitudinal lab sequences</text>

    <!-- Simple pipeline: three boxes with arrows -->
    <rect x="20" y="80" width="135" height="100" rx="10" fill="#f0f7fa" stroke="#b8d4e3" stroke-width="1.2"/>
    <text x="87" y="115" font-size="13" fill="#4a8aad" text-anchor="middle" font-weight="700">Patient</text>
    <text x="87" y="135" font-size="13" fill="#4a8aad" text-anchor="middle" font-weight="700">history</text>
    <text x="87" y="158" font-size="11" fill="#8aacbe" text-anchor="middle">Lab sequence t1...tn</text>

    <!-- Arrow -->
    <line x1="165" y1="130" x2="195" y2="130" stroke="#1a6b5a" stroke-width="2.5"/>
    <polygon points="193,124 205,130 193,136" fill="#1a6b5a"/>

    <rect x="210" y="80" width="100" height="100" rx="10" fill="#e6f5f0" stroke="#1a6b5a" stroke-width="2"/>
    <text x="260" y="125" font-size="14" fill="#1a6b5a" text-anchor="middle" font-weight="800">Transformer</text>
    <text x="260" y="158" font-size="11" fill="#2a9d7e" text-anchor="middle">3.4M sequences</text>

    <!-- Arrow -->
    <line x1="320" y1="130" x2="350" y2="130" stroke="#1a6b5a" stroke-width="2.5"/>
    <polygon points="348,124 360,130 348,136" fill="#1a6b5a"/>

    <rect x="365" y="80" width="135" height="100" rx="10" fill="#f0f7fa" stroke="#b8d4e3" stroke-width="1.2"/>
    <text x="432" y="115" font-size="13" fill="#4a8aad" text-anchor="middle" font-weight="700">Adaptive</text>
    <text x="432" y="135" font-size="13" fill="#4a8aad" text-anchor="middle" font-weight="700">interval</text>
    <text x="432" y="158" font-size="11" fill="#8aacbe" text-anchor="middle">Per-patient</text>

    <!-- Key insight -->
    <rect x="50" y="210" width="400" height="50" rx="8" fill="#e6f5f0"/>
    <text x="250" y="235" font-size="13" fill="#1a6b5a" text-anchor="middle" font-weight="700">Anchors individual trajectories to population priors</text>
    <text x="250" y="252" font-size="12" fill="#4a8a7a" text-anchor="middle">Sensitivity of personal baselines + specificity of population context</text>

    <!-- Scale badges -->
    <text x="250" y="295" font-size="12" fill="#888" text-anchor="middle" font-weight="600">Training scale</text>
    <rect x="30" y="308" width="110" height="32" rx="6" fill="#f0f7fa"/>
    <text x="85" y="329" font-size="12" fill="#4a8aad" text-anchor="middle" font-weight="600">1.5M patients</text>
    <rect x="155" y="308" width="100" height="32" rx="6" fill="#f0f7fa"/>
    <text x="205" y="329" font-size="12" fill="#4a8aad" text-anchor="middle" font-weight="600">~2B lab values</text>
    <rect x="270" y="308" width="100" height="32" rx="6" fill="#f0f7fa"/>
    <text x="320" y="329" font-size="12" fill="#4a8aad" text-anchor="middle" font-weight="600">20+ years</text>
    <rect x="385" y="308" width="110" height="32" rx="6" fill="#f0f7fa"/>
    <text x="440" y="329" font-size="12" fill="#4a8aad" text-anchor="middle" font-weight="600">30 analytes</text>
  </g>

  <!-- ===== Divider ===== -->
  <line x1="1080" y1="30" x2="1080" y2="460" stroke="#e8e8e8" stroke-width="1"/>

  <!-- ===== RIGHT: IMPACT ===== -->
  <text x="1140" y="45" font-size="14" fill="#999" font-weight="700" letter-spacing="0.15em">IMPACT</text>

  <g transform="translate(1120, 80)">
    <!-- Hero stat -->
    <text x="220" y="55" font-size="56" fill="#1a6b5a" text-anchor="middle" font-weight="800">9.3 months</text>
    <text x="220" y="85" font-size="16" fill="#2a9d7e" text-anchor="middle" font-weight="600">earlier detection of abnormalities</text>
    <text x="220" y="110" font-size="13" fill="#888" text-anchor="middle">vs. population reference intervals</text>

    <line x1="60" y1="135" x2="380" y2="135" stroke="#e8e8e8" stroke-width="1"/>

    <!-- Precision -->
    <text x="220" y="170" font-size="15" fill="#1a6b5a" text-anchor="middle" font-weight="700">Higher precision for predicting</text>
    <text x="220" y="195" font-size="14" fill="#888" text-anchor="middle">Mortality &middot; Acute kidney injury &middot; Chronic disease</text>

    <line x1="60" y1="220" x2="380" y2="220" stroke="#e8e8e8" stroke-width="1"/>

    <!-- Validated -->
    <text x="220" y="255" font-size="14" fill="#888" text-anchor="middle" font-weight="600">Validated across two independent cohorts</text>
    <text x="220" y="278" font-size="13" fill="#bbb" text-anchor="middle">Clalit Health Services (Israel) &middot; eICU (US)</text>

    <line x1="60" y1="305" x2="380" y2="305" stroke="#e8e8e8" stroke-width="1"/>

    <!-- Open source -->
    <text x="220" y="340" font-size="14" fill="#1a6b5a" text-anchor="middle" font-weight="700">Open source model, code, and interactive demo</text>
    <text x="220" y="365" font-size="13" fill="#4a9a8a" text-anchor="middle">Deployable with existing EHR laboratory workflows</text>
  </g>
</svg>
