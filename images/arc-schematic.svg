<svg viewBox="0 0 1600 480" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans', 'Helvetica Neue', sans-serif">
  <rect width="1600" height="480" fill="white"/>
  <rect x="0" y="0" width="1600" height="3" fill="#1a6b5a"/>

  <!-- ===== LEFT: PROBLEM ===== -->
  <text x="80" y="45" font-size="14" fill="#999" font-weight="700" letter-spacing="0.15em">THE PROBLEM</text>

  <g transform="translate(60, 70)">
    <text x="220" y="20" font-size="14" fill="#666" text-anchor="middle" font-weight="600">Your breathing test uses a different equation based on your race</text>

    <!-- The equation -->
    <rect x="40" y="40" width="370" height="55" rx="10" fill="#fef5f0" stroke="#e8c0b0" stroke-width="1.2"/>
    <text x="225" y="68" font-size="15" fill="#555" text-anchor="middle">Expected lung function = f( age, sex, height, <tspan fill="#d94030" font-weight="800">race</tspan> )</text>
    <text x="225" y="86" font-size="12" fill="#c08060" text-anchor="middle">Race has no single biological meaning</text>

    <!-- Two groups - using abstract person icons, NOT skin tone -->
    <g transform="translate(0, 115)">
      <rect x="25" y="0" width="180" height="150" rx="10" fill="#f8f9fa" stroke="#e5e5e5" stroke-width="1"/>
      <text x="115" y="28" font-size="13" fill="#888" text-anchor="middle" font-weight="600">Equation A</text>
      <!-- Abstract person icons (outlined, not filled with skin color) -->
      <circle cx="60" cy="70" r="14" fill="none" stroke="#8aacbe" stroke-width="2"/>
      <line x1="60" y1="84" x2="60" y2="108" stroke="#8aacbe" stroke-width="2"/>
      <circle cx="115" cy="70" r="14" fill="none" stroke="#8aacbe" stroke-width="2"/>
      <line x1="115" y1="84" x2="115" y2="108" stroke="#8aacbe" stroke-width="2"/>
      <circle cx="170" cy="70" r="14" fill="none" stroke="#8aacbe" stroke-width="2"/>
      <line x1="170" y1="84" x2="170" y2="108" stroke="#8aacbe" stroke-width="2"/>
      <text x="115" y="135" font-size="12" fill="#6a8a9a" text-anchor="middle">Expected: higher</text>

      <!-- Divider -->
      <line x1="222" y1="10" x2="222" y2="140" stroke="#d94030" stroke-width="2.5" stroke-dasharray="8,5"/>

      <rect x="242" y="0" width="180" height="150" rx="10" fill="#f8f9fa" stroke="#e5e5e5" stroke-width="1"/>
      <text x="332" y="28" font-size="13" fill="#888" text-anchor="middle" font-weight="600">Equation B</text>
      <circle cx="280" cy="70" r="14" fill="none" stroke="#8aacbe" stroke-width="2"/>
      <line x1="280" y1="84" x2="280" y2="108" stroke="#8aacbe" stroke-width="2"/>
      <circle cx="335" cy="70" r="14" fill="none" stroke="#8aacbe" stroke-width="2"/>
      <line x1="335" y1="84" x2="335" y2="108" stroke="#8aacbe" stroke-width="2"/>
      <circle cx="390" cy="70" r="14" fill="none" stroke="#8aacbe" stroke-width="2"/>
      <line x1="390" y1="84" x2="390" y2="108" stroke="#8aacbe" stroke-width="2"/>
      <text x="332" y="135" font-size="12" fill="#6a8a9a" text-anchor="middle">Expected: lower</text>
    </g>
  </g>

  <text x="280" y="420" font-size="15" fill="#d94030" text-anchor="middle" font-weight="700">Simply removing race doesn't address what it was proxying.</text>
  <text x="280" y="448" font-size="13" fill="#999" text-anchor="middle">This practice dates to the 1840s.</text>

  <!-- ===== Divider ===== -->
  <line x1="530" y1="30" x2="530" y2="460" stroke="#e8e8e8" stroke-width="1"/>

  <!-- ===== CENTER: APPROACH ===== -->
  <text x="590" y="45" font-size="14" fill="#1a6b5a" font-weight="700" letter-spacing="0.15em">OUR APPROACH</text>

  <g transform="translate(560, 70)">
    <text x="250" y="25" font-size="22" fill="#1a6b5a" text-anchor="middle" font-weight="800">ARC</text>
    <text x="250" y="50" font-size="13" fill="#4a9a8a" text-anchor="middle">Replace race with what it was proxying: measurable anatomy</text>

    <!-- Single visual: Race decomposing into individual features -->
    <!-- Race (fading) -->
    <rect x="155" y="80" width="190" height="40" rx="10" fill="#fef5f0" opacity="0.4" stroke="#d94030" stroke-width="1.2" stroke-dasharray="6,4"/>
    <text x="250" y="106" font-size="15" fill="#d94030" text-anchor="middle" opacity="0.35" font-weight="600">Race</text>

    <!-- Arrows fanning down -->
    <line x1="200" y1="120" x2="100" y2="165" stroke="#1a6b5a" stroke-width="2.5"/>
    <line x1="250" y1="120" x2="250" y2="165" stroke="#1a6b5a" stroke-width="2.5"/>
    <line x1="300" y1="120" x2="400" y2="165" stroke="#1a6b5a" stroke-width="2.5"/>

    <!-- Three anatomical factors -->
    <rect x="25" y="165" width="155" height="75" rx="10" fill="#e6f5f0" stroke="#1a6b5a" stroke-width="1.5"/>
    <text x="102" y="198" font-size="15" fill="#1a6b5a" text-anchor="middle" font-weight="700">Sitting Height</text>
    <text x="102" y="220" font-size="12" fill="#4a8a7a" text-anchor="middle">Torso proportion</text>

    <rect x="195" y="165" width="115" height="75" rx="10" fill="#e6f5f0" stroke="#1a6b5a" stroke-width="1.5"/>
    <text x="252" y="198" font-size="15" fill="#1a6b5a" text-anchor="middle" font-weight="700">Waist</text>
    <text x="252" y="220" font-size="12" fill="#4a8a7a" text-anchor="middle">Body morphology</text>

    <rect x="325" y="165" width="115" height="75" rx="10" fill="#e6f5f0" stroke="#1a6b5a" stroke-width="1.5"/>
    <text x="382" y="198" font-size="15" fill="#1a6b5a" text-anchor="middle" font-weight="700">Height</text>
    <text x="382" y="220" font-size="12" fill="#4a8a7a" text-anchor="middle">Standing</text>

    <!-- Arrow down to new equation -->
    <line x1="250" y1="240" x2="250" y2="275" stroke="#1a6b5a" stroke-width="2.5"/>
    <polygon points="244,273 250,285 256,273" fill="#1a6b5a"/>

    <!-- New equation -->
    <rect x="40" y="290" width="420" height="50" rx="10" fill="#e6f5f0" stroke="#1a6b5a" stroke-width="2"/>
    <text x="250" y="320" font-size="14" fill="#1a6b5a" text-anchor="middle" font-weight="700">ARC<tspan font-size="11" dy="2">PFT</tspan><tspan dy="-2">:  f( age, sex, height, </tspan><tspan font-weight="800">sit_ht</tspan>, <tspan font-weight="800">waist</tspan> )</text>

    <!-- Data -->
    <text x="250" y="370" font-size="13" fill="#8aacbe" text-anchor="middle">NHANES + UK Biobank  &middot;  147,552 participants</text>
  </g>

  <!-- ===== Divider ===== -->
  <line x1="1080" y1="30" x2="1080" y2="460" stroke="#e8e8e8" stroke-width="1"/>

  <!-- ===== RIGHT: IMPACT ===== -->
  <text x="1140" y="45" font-size="14" fill="#999" font-weight="700" letter-spacing="0.15em">IMPACT</text>

  <g transform="translate(1120, 80)">
    <!-- Hero statement -->
    <text x="220" y="45" font-size="28" fill="#1a6b5a" text-anchor="middle" font-weight="800">One equation</text>
    <text x="220" y="80" font-size="28" fill="#1a6b5a" text-anchor="middle" font-weight="800">for everyone</text>
    <text x="220" y="110" font-size="14" fill="#2a9d7e" text-anchor="middle">Built on your body, not your demographic group</text>

    <line x1="60" y1="135" x2="380" y2="135" stroke="#e8e8e8" stroke-width="1"/>

    <!-- Hero number -->
    <text x="220" y="180" font-size="42" fill="#1a6b5a" text-anchor="middle" font-weight="800">15--22%</text>
    <text x="220" y="208" font-size="14" fill="#2a9d7e" text-anchor="middle" font-weight="600">lower prediction error</text>
    <text x="220" y="228" font-size="13" fill="#888" text-anchor="middle">vs. race-neutral standard (GLI-Global)</text>

    <line x1="60" y1="250" x2="380" y2="250" stroke="#e8e8e8" stroke-width="1"/>

    <!-- Generalization -->
    <text x="220" y="285" font-size="15" fill="#1a6b5a" text-anchor="middle" font-weight="700">Generalizes across populations</text>
    <text x="220" y="310" font-size="13" fill="#888" text-anchor="middle">Works for Asian and Hispanic patients where</text>
    <text x="220" y="330" font-size="13" fill="#888" text-anchor="middle">race-stratified models fail</text>

    <line x1="60" y1="355" x2="380" y2="355" stroke="#e8e8e8" stroke-width="1"/>

    <!-- Extensible -->
    <text x="220" y="390" font-size="14" fill="#1a6b5a" text-anchor="middle" font-weight="700">Extends to any clinical equation</text>
    <text x="220" y="412" font-size="13" fill="#4a9a8a" text-anchor="middle">where demographics proxy for biology</text>
  </g>
</svg>
