<svg viewBox="0 0 1100 380" width="1100" height="380" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans', 'Helvetica Neue', sans-serif">
  <rect width="1100" height="380" fill="white"/>

  <text x="550" y="30" font-size="14" fill="#666" text-anchor="middle" font-weight="600">Your lab values over years of doctor visits</text>

  <!-- Population band -->
  <rect x="80" y="50" width="700" height="250" rx="6" fill="#f0f5f8" opacity="0.5"/>
  <text x="100" y="75" font-size="13" fill="#8aacbe">Population "normal" range</text>
  <line x1="80" y1="50" x2="780" y2="50" stroke="#b8d0dd" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="80" y1="300" x2="780" y2="300" stroke="#b8d0dd" stroke-width="1.2" stroke-dasharray="6,4"/>

  <!-- Patient trajectory -->
  <path d="M110,275 C200,268 300,248 400,215 C500,178 600,130 720,80" fill="none" stroke="#d94030" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M110,275 C200,268 300,248 400,215 C500,178 600,130 720,80" fill="none" stroke="#d94030" stroke-width="12" stroke-linecap="round" opacity="0.06"/>

  <!-- Visit dots with "Normal" badges -->
  <circle cx="110" cy="275" r="8" fill="#d94030"/>
  <rect x="125" y="263" width="65" height="22" rx="5" fill="#e8f5e9"/>
  <text x="157" y="278" font-size="12" fill="#388e3c" text-anchor="middle" font-weight="600">Normal</text>

  <circle cx="250" cy="255" r="8" fill="#d94030"/>
  <rect x="265" y="243" width="65" height="22" rx="5" fill="#e8f5e9"/>
  <text x="297" y="258" font-size="12" fill="#388e3c" text-anchor="middle" font-weight="600">Normal</text>

  <circle cx="400" cy="215" r="8" fill="#d94030"/>
  <rect x="415" y="203" width="65" height="22" rx="5" fill="#e8f5e9"/>
  <text x="447" y="218" font-size="12" fill="#388e3c" text-anchor="middle" font-weight="600">Normal</text>

  <circle cx="560" cy="158" r="8" fill="#d94030"/>
  <rect x="575" y="146" width="65" height="22" rx="5" fill="#e8f5e9"/>
  <text x="607" y="161" font-size="12" fill="#388e3c" text-anchor="middle" font-weight="600">Normal</text>

  <circle cx="720" cy="80" r="8" fill="#d94030"/>

  <!-- Disease annotation -->
  <text x="720" y="65" font-size="14" fill="#d94030" font-weight="700" text-anchor="middle">Disease developing</text>

  <!-- Time axis -->
  <text x="430" y="330" font-size="13" fill="#bbb" text-anchor="middle">Time (years)</text>

  <!-- Insight text on right -->
  <g transform="translate(820, 80)">
    <text x="0" y="20" font-size="18" fill="#d94030" font-weight="700">Every result</text>
    <text x="0" y="45" font-size="18" fill="#d94030" font-weight="700">is "normal."</text>
    <text x="0" y="90" font-size="14" fill="#999">The drift toward</text>
    <text x="0" y="110" font-size="14" fill="#999">disease is invisible</text>
    <text x="0" y="130" font-size="14" fill="#999">to population-based</text>
    <text x="0" y="150" font-size="14" fill="#999">reference intervals.</text>

    <line x1="0" y1="175" x2="200" y2="175" stroke="#e8e8e8" stroke-width="1"/>

    <text x="0" y="205" font-size="13" fill="#bbb">Within-person variation</text>
    <text x="0" y="225" font-size="13" fill="#bbb">is far narrower than</text>
    <text x="0" y="245" font-size="13" fill="#bbb">the population range.</text>
  </g>
</svg>
