<svg viewBox="0 0 1100 320" width="1100" height="320" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans', 'Helvetica Neue', sans-serif">
  <rect width="1100" height="320" fill="white"/>

  <!-- Race decomposition: the single visual -->
  <g transform="translate(50, 20)">
    <!-- Race (fading) -->
    <rect x="240" y="0" width="200" height="42" rx="10" fill="#fef5f0" opacity="0.4" stroke="#d94030" stroke-width="1.2" stroke-dasharray="6,4"/>
    <text x="340" y="28" font-size="16" fill="#d94030" text-anchor="middle" opacity="0.35" font-weight="600">Race</text>

    <!-- Arrows fanning -->
    <line x1="280" y1="42" x2="130" y2="90" stroke="#1a6b5a" stroke-width="2.5"/>
    <line x1="340" y1="42" x2="340" y2="90" stroke="#1a6b5a" stroke-width="2.5"/>
    <line x1="400" y1="42" x2="550" y2="90" stroke="#1a6b5a" stroke-width="2.5"/>

    <!-- Three anatomy boxes -->
    <rect x="30" y="90" width="200" height="75" rx="10" fill="#e6f5f0" stroke="#1a6b5a" stroke-width="1.5"/>
    <text x="130" y="122" font-size="17" fill="#1a6b5a" text-anchor="middle" font-weight="700">Sitting Height</text>
    <text x="130" y="145" font-size="12" fill="#4a8a7a" text-anchor="middle">Torso proportion</text>

    <rect x="250" y="90" width="180" height="75" rx="10" fill="#e6f5f0" stroke="#1a6b5a" stroke-width="1.5"/>
    <text x="340" y="122" font-size="17" fill="#1a6b5a" text-anchor="middle" font-weight="700">Waist</text>
    <text x="340" y="145" font-size="12" fill="#4a8a7a" text-anchor="middle">Body morphology</text>

    <rect x="450" y="90" width="180" height="75" rx="10" fill="#e6f5f0" stroke="#1a6b5a" stroke-width="1.5"/>
    <text x="540" y="122" font-size="17" fill="#1a6b5a" text-anchor="middle" font-weight="700">Height</text>
    <text x="540" y="145" font-size="12" fill="#4a8a7a" text-anchor="middle">Standing measurement</text>

    <!-- Arrow down -->
    <line x1="340" y1="165" x2="340" y2="205" stroke="#1a6b5a" stroke-width="2.5"/>
    <polygon points="333,202 340,215 347,202" fill="#1a6b5a"/>

    <!-- New equation -->
    <rect x="80" y="218" width="520" height="48" rx="10" fill="#e6f5f0" stroke="#1a6b5a" stroke-width="2"/>
    <text x="340" y="248" font-size="15" fill="#1a6b5a" text-anchor="middle" font-weight="700">ARC<tspan font-size="11" dy="2">PFT</tspan><tspan dy="-2">: One equation built on your body, not your race</tspan></text>
  </g>

  <!-- Impact stats on the right -->
  <g transform="translate(770, 20)">
    <text x="130" y="30" font-size="42" fill="#1a6b5a" text-anchor="middle" font-weight="800">15-22%</text>
    <text x="130" y="58" font-size="14" fill="#2a9d7e" text-anchor="middle" font-weight="600">lower prediction error</text>
    <text x="130" y="78" font-size="12" fill="#888" text-anchor="middle">vs. race-neutral standard</text>

    <line x1="20" y1="100" x2="240" y2="100" stroke="#e8e8e8" stroke-width="1"/>

    <text x="130" y="130" font-size="14" fill="#1a6b5a" text-anchor="middle" font-weight="700">Generalizes across populations</text>
    <text x="130" y="152" font-size="12" fill="#888" text-anchor="middle">Works for Asian and Hispanic patients</text>
    <text x="130" y="170" font-size="12" fill="#888" text-anchor="middle">where existing models fail</text>

    <line x1="20" y1="192" x2="240" y2="192" stroke="#e8e8e8" stroke-width="1"/>

    <text x="130" y="222" font-size="14" fill="#1a6b5a" text-anchor="middle" font-weight="700">Extends to any equation</text>
    <text x="130" y="244" font-size="12" fill="#4a9a8a" text-anchor="middle">where demographics proxy for biology</text>

    <rect x="0" y="268" width="260" height="28" rx="6" fill="#f0f7fa"/>
    <text x="130" y="287" font-size="12" fill="#8aacbe" text-anchor="middle">NHANES + UK Biobank &middot; 147,552 participants</text>
  </g>
</svg>
